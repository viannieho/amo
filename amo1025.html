<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>阿默款待服務記錄</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --cream:#FBF6EE;
  --cream-soft:#F3E9D8;
  --card:#FFFFFF;
  --ink:#2C221A;
  --muted:#7A6B57;
  --wine:#8C2C47;
  --wine-deep:#6E1F35;
  --caramel:#C17F3E;
  --caramel-deep:#9C5F27;
  --line:#E7DAC3;
  --good:#4B7B5A;
  --bad:#B0453F;
  --bg:var(--cream);
  --fg:var(--ink);
  --surface:var(--card);
  --border:var(--line);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#211A15; --fg:#F3E7D6; --surface:#2C241D; --border:#4A3C2E;
    --muted:#C3AE8E; --wine:#E8A7B6; --wine-deep:#D98198;
    --caramel:#E3A564; --caramel-deep:#D3883E; --good:#8FC79E; --bad:#E89A92;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;}
[hidden]{display:none!important;}
html,body{margin:0;}
body{
  background:var(--bg); color:var(--fg);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
}
h1,h2,h3{font-family:"Noto Serif TC","Noto Sans TC",serif; font-weight:700; margin:0;}
.page{max-width:720px; margin:0 auto; padding-block:20px 48px; display:flex; flex-direction:column; gap:18px;}
.topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--bg); padding-block:6px 10px; border-bottom:1px solid var(--border); display:flex; flex-direction:column; gap:12px;}
.brand{display:flex; align-items:baseline; gap:10px;}
.brand-mark{font-family:"Noto Serif TC",serif; font-weight:700; font-size:13px; letter-spacing:.18em; color:var(--caramel-deep); border:1px solid var(--caramel-deep); padding:3px 8px; border-radius:3px;}
.brand h1{font-size:22px; color:var(--wine-deep);}
.tabs{display:flex; gap:6px; background:var(--cream-soft); border-radius:999px; padding:4px; width:fit-content;}
@media (prefers-color-scheme: dark){ .tabs{background:var(--surface);} }
.tab{border:none; background:transparent; color:var(--muted); font-family:inherit; font-size:14px; font-weight:500; padding:8px 16px; border-radius:999px; cursor:pointer;}
.tab.active{background:var(--wine); color:#fff;}
.view{display:flex; flex-direction:column; gap:18px;}
.card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px 18px 20px; box-shadow:0 1px 2px rgba(0,0,0,.04);}
.section-head{margin-bottom:12px;}
.section-head h2{font-size:17px; color:var(--wine-deep);}
@media (prefers-color-scheme: dark){ .section-head h2{color:var(--wine);} }
.hint{margin:4px 0 0; font-size:12.5px; color:var(--muted);}
form{display:flex; flex-direction:column; gap:12px;}
label{display:flex; flex-direction:column; gap:5px; font-size:12.5px; color:var(--muted); font-weight:500;}
.field-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
@media (max-width:480px){ .field-grid{grid-template-columns:1fr;} }
select,input,textarea{font-family:inherit; font-size:14.5px; color:var(--fg); background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:9px 10px; width:100%;}
textarea{resize:vertical; min-height:52px;}
select:focus,input:focus,textarea:focus{outline:2px solid var(--caramel); outline-offset:1px;}
.form-actions{display:flex; align-items:center; gap:12px; margin-top:4px; flex-wrap:wrap;}
.btn{border:none; border-radius:999px; padding:10px 20px; font-family:inherit; font-size:14px; font-weight:700; cursor:pointer;}
.btn:active{opacity:.8;}
.btn:disabled{opacity:.5; cursor:not-allowed;}
.btn-primary{background:var(--wine); color:#fff;}
.btn-accent{background:var(--caramel); color:#fff;}
.save-status{font-size:12.5px; min-height:1em;}
.today-list{margin-top:16px; padding-top:14px; border-top:1px dashed var(--border);}
.today-list h3{font-size:13px; color:var(--muted); font-weight:500; font-family:inherit;}
.today-list h3 span{color:var(--wine); font-weight:700; font-size:15px;}
#memory-today-items{list-style:none; margin:10px 0 0; padding:0; display:flex; flex-direction:column; gap:8px;}
#memory-today-items li{background:var(--cream-soft); border-radius:8px; padding:9px 11px; font-size:13px;}
@media (prefers-color-scheme: dark){ #memory-today-items li{background:var(--bg);} }
#memory-today-items li .li-name{font-weight:700; color:var(--wine); margin-right:6px;}
#memory-today-items li .li-quote{color:var(--muted);}
.tasting-total{display:flex; align-items:baseline; gap:8px; background:linear-gradient(135deg,var(--caramel),var(--caramel-deep)); color:#fff; border-radius:12px; padding:16px 18px; margin-bottom:14px;}
.total-label{font-size:13px; opacity:.92;}
.total-number{font-size:32px; font-weight:700; font-family:"Noto Serif TC",serif; line-height:1;}
.total-unit{font-size:13px; opacity:.92;}
.total-sub{margin-left:auto; font-size:12px; opacity:.85;}
.empty-note{font-size:12.5px; color:var(--muted); padding:6px 0;}
.stat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
@media (max-width:480px){ .stat-grid{grid-template-columns:1fr 1fr;} }
.stat{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px; text-align:center;}
.stat .num{font-size:24px; font-weight:700; color:var(--wine); font-family:"Noto Serif TC",serif;}
.stat .lbl{font-size:11.5px; color:var(--muted); margin-top:3px;}
.emp-table{width:100%; border-collapse:collapse; font-size:13.5px;}
.emp-table th,.emp-table td{text-align:left; padding:8px 6px; border-bottom:1px solid var(--border);}
.emp-table th{color:var(--muted); font-weight:500; font-size:12px;}
.emp-table td.num{text-align:right; font-weight:700; color:var(--caramel-deep);}
@media (prefers-color-scheme: dark){ .emp-table td.num{color:var(--caramel);} }
.table-wrap{overflow-x:auto;}
.memo-entry{border-bottom:1px solid var(--border); padding:10px 0; font-size:13px;}
.memo-entry:last-child{border-bottom:none;}
.memo-entry .row1{display:flex; justify-content:space-between; gap:8px; margin-bottom:3px;}
.memo-entry .nm{font-weight:700; color:var(--wine);}
.memo-entry .dt{color:var(--muted); font-size:12px;}
.memo-entry .qt{font-style:italic; color:var(--muted); margin-top:2px;}
.memo-entry details summary{cursor:pointer; color:var(--caramel-deep); font-size:12.5px; margin-top:4px;}
.memo-entry .detail-body{margin-top:6px; display:flex; flex-direction:column; gap:4px; color:var(--fg);}
.memo-entry .detail-body b{color:var(--muted); font-weight:500; margin-right:4px;}
.notice{background:var(--cream-soft); border:1px solid var(--border); border-radius:10px; padding:12px 14px; font-size:13px; color:var(--muted);}
@media (prefers-color-scheme: dark){ .notice{background:var(--surface);} }
footer{text-align:center; font-size:11.5px; color:var(--muted); padding-top:10px;}


/* setup modal */
.modal-backdrop{position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;}
.modal{background:var(--surface); border-radius:14px; padding:22px; max-width:440px; width:100%; display:flex; flex-direction:column; gap:12px; border:1px solid var(--border);}
.modal h2{font-size:16px; color:var(--wine-deep);}
.modal p{font-size:13px; color:var(--muted); margin:0; line-height:1.6;}
.modal .btn{align-self:flex-end;}
.gear{position:fixed; right:max(14px, env(safe-area-inset-right,0px)); bottom:14px; z-index:30; background:var(--surface); border:1px solid var(--border); border-radius:999px; width:38px; height:38px; display:flex; align-items:center; justify-content:center; font-size:16px; cursor:pointer; color:var(--muted); box-shadow:0 1px 4px rgba(0,0,0,.12);}

/* overview */
.page.wide{max-width:820px;}
.filters{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
@media (max-width:640px){ .filters{grid-template-columns:1fr 1fr;} .filters .f-search{grid-column:1/-1;} }
.seg{display:flex; gap:6px; background:var(--cream-soft); border-radius:999px; padding:4px; width:fit-content; margin-bottom:14px;}
@media (prefers-color-scheme: dark){ .seg{background:var(--bg);} }
.seg button{border:none; background:transparent; color:var(--muted); font-family:inherit; font-size:15px; font-weight:700; padding:9px 26px; border-radius:999px; cursor:pointer;}
.seg button.on{background:var(--caramel-deep); color:#fff;}
.seg-label{font-size:12.5px; color:var(--muted); font-weight:500; margin-bottom:6px;}
.store-tag{display:inline-block; font-size:11px; font-weight:700; color:var(--caramel-deep); border:1px solid var(--caramel-deep); border-radius:4px; padding:0 6px; margin-left:8px; vertical-align:middle;}
@media (prefers-color-scheme: dark){ .store-tag{color:var(--caramel); border-color:var(--caramel);} }
.pending{display:inline-block; font-size:11px; color:var(--bad); margin-left:8px;}
.count-line{font-size:13px; color:var(--muted);}
.count-line b{color:var(--wine); font-size:15px;}
.feed{display:flex; flex-direction:column; gap:14px;}
.post{background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden; box-shadow:0 1px 2px rgba(0,0,0,.04);}
.post-body{padding:16px 18px 14px; display:flex; flex-direction:column; gap:10px;}
.post-head{display:flex; align-items:center; gap:10px;}
.avatar{width:38px; height:38px; border-radius:50%; background:var(--wine); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; flex:none; font-family:"Noto Serif TC",serif;}
.avatar.mgr{background:var(--caramel-deep);}
.post-who{display:flex; flex-direction:column; min-width:0;}
.post-who .nm{font-weight:700; font-size:15px;}
.post-who .dt{font-size:12px; color:var(--muted);}
.quote{font-family:"Noto Serif TC",serif; font-size:17px; line-height:1.55; color:var(--wine-deep); border-left:3px solid var(--caramel); padding:2px 0 2px 12px;}
@media (prefers-color-scheme: dark){ .quote{color:var(--wine);} }
.quote .sug{display:inline-block; font-family:"Noto Sans TC",sans-serif; font-size:11px; font-weight:500; color:var(--muted); border:1px solid var(--border); border-radius:999px; padding:1px 8px; vertical-align:middle; margin-left:4px;}
.rows{display:flex; flex-direction:column; gap:7px; font-size:14px; line-height:1.6;}
.rows .r{display:grid; grid-template-columns:5.5em 1fr; gap:8px;}
.rows .k{color:var(--muted); font-size:12.5px; padding-top:1px;}
.rows .v{white-space:pre-wrap; word-break:break-word;}
@media (max-width:480px){ .rows .r{grid-template-columns:1fr; gap:1px;} }
.cm{background:var(--cream-soft); border-top:1px solid var(--border); padding:12px 18px 16px; display:flex; flex-direction:column; gap:10px;}
@media (prefers-color-scheme: dark){ .cm{background:var(--bg);} }
.cm-title{font-size:12.5px; color:var(--muted); font-weight:500;}
.cm-item{display:flex; gap:9px;}
.cm-item .avatar{width:30px; height:30px; font-size:12.5px;}
.cm-main{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:8px 12px; min-width:0; flex:1;}
.cm-meta{display:flex; flex-wrap:wrap; gap:4px 8px; align-items:baseline;}
.cm-meta .who{font-weight:700; font-size:13.5px; color:var(--caramel-deep);}
@media (prefers-color-scheme: dark){ .cm-meta .who{color:var(--caramel);} }
.cm-meta .when{font-size:11.5px; color:var(--muted);}
.cm-text{font-size:14px; line-height:1.6; white-space:pre-wrap; word-break:break-word; margin-top:2px;}
.cm-form{display:flex; flex-direction:column; gap:8px;}
.cm-form .row{display:grid; grid-template-columns:150px 1fr; gap:8px;}
@media (max-width:480px){ .cm-form .row{grid-template-columns:1fr;} }
.cm-form textarea{min-height:44px;}
.cm-form .act{display:flex; align-items:center; gap:10px;}
.btn-sm{padding:8px 16px; font-size:13px;}
.empty-card{background:var(--surface); border:1px dashed var(--border); border-radius:14px; padding:28px; text-align:center; color:var(--muted); font-size:14px;}
</style>
</head>
<body>
<div class="page" id="page">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">AMO</span>
      <h1>款待服務記錄</h1>
    </div>
    <nav class="tabs">
      <button class="tab active" data-tab="fill">填寫記憶點</button>
      <button class="tab" data-tab="admin">記憶點總覽</button>
    </nav>
  </header>

  <main id="view-fill" class="view">
    <div id="db-notice" class="notice" hidden></div>
    <section class="card">
      <div class="section-head">
        <h2>記憶點個案分享</h2>
        <p class="hint">服務完客人後馬上記一則，細節才不會忘記。送出後可以直接接著寫下一則。</p>
      </div>
      <div class="seg-label">門市</div>
      <div class="seg" id="store-seg"></div>
      <form id="memory-form">
        <div class="field-grid">
          <label>姓名
            <select name="name" required></select>
          </label>
          <label>日期
            <input type="date" name="date" required>
          </label>
        </div>
        <label>客戶樣貌
          <textarea name="appearance" rows="2" placeholder="例如：帶著兩個孩子趕時間的媽媽" required></textarea>
        </label>
        <label>觸發的事件
          <textarea name="trigger" rows="2" placeholder="發生了什麼事，讓你特別留意？" required></textarea>
        </label>
        <label>解決的事情
          <textarea name="resolution" rows="2" placeholder="你怎麼回應、怎麼處理？" required></textarea>
        </label>
        <label>記憶點的一句話
          <input type="text" name="quote" placeholder="用一句話記住這個瞬間" required>
        </label>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">送出這一則</button>
          <span class="save-status" id="memory-status"></span>
        </div>
      </form>
      <div class="today-list">
        <h3>今天已新增 <span id="memory-today-count">0</span> 則</h3>
        <ul id="memory-today-items"></ul>
      </div>
    </section>
  </main>

  <main id="view-admin" class="view" hidden>
    <section class="card">
      <div class="filters">
        <label>門市
          <select id="f-store"></select>
        </label>
        <label>排序
          <select id="f-sort"><option value="new">最新優先</option><option value="old">最舊優先</option></select>
        </label>
        <label>人員
          <select id="f-person"></select>
        </label>
        <label>月份
          <select id="f-month"></select>
        </label>
        <label>回饋狀態
          <select id="f-fb"><option value="all">全部</option><option value="none">尚未回饋</option><option value="has">已有回饋</option></select>
        </label>
        <label class="f-search">關鍵字
          <input type="search" id="f-q" placeholder="搜尋內容、一句話">
        </label>
      </div>
    </section>
    <div class="count-line" id="count-line"></div>
    <div class="feed" id="feed"></div>
  </main>

  <footer>阿默款待服務．內部記錄工具</footer>
</div>

<div class="gear" id="settings-gear" title="設定資料庫連接網址">⚙</div>

<script>
(function(){
  "use strict";

  // ====== 設定區：Google Apps Script 網頁應用程式網址 ======
  var DEFAULT_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbygdtxvLQ5_EoYuBT_Ise8IjLnnLF0hlDGaNJ4sRcnTKhdN0ui7BNjrz4Psvo4J4u4tqw/exec";
  // =========================================================

  // 新增門市：在 STORES / STAFF / MANAGERS_BY_STORE 各加一行即可
  var DEFAULT_STORE = "土門";   // 試算表裡沒有門市欄位的舊資料，一律視為土門
  var STORES = ["土門","土咖"];
  var STAFF = {
    "土門": ["家家","宣慧","力太","欣梅","仕臻","騰允","家香","珮芸","俐心"],
    "土咖": ["雅如","文玲","明玉","易成","捷茂","意潔","詩珊"]
  };
  var MANAGERS_BY_STORE = {
    "土門": ["雅惠經理","芷穎督導","俐心店長","圈圈顧問"],
    "土咖": ["明玉店長","芷穎督導","雅惠經理","圈圈顧問"]
  };
  var STORE_KEY = "amo_store";
  function storeOf(m){ return m.store || DEFAULT_STORE; }
  var STORAGE_KEY = "amo_webapp_url";
  var MGR_KEY = "amo_last_manager";

  function pad(n){ return String(n).padStart(2,"0"); }
  function todayStr(){
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
  }
  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];
    });
  }
  function fillSelect(sel, options, placeholder){
    sel.innerHTML = "";
    if (placeholder){
      var ph = document.createElement("option");
      ph.value = ""; ph.textContent = placeholder; ph.disabled = true; ph.selected = true;
      sel.appendChild(ph);
    }
    options.forEach(function(o){
      var opt = document.createElement("option");
      opt.value = o; opt.textContent = o;
      sel.appendChild(opt);
    });
  }
  var SUG = "(補充建議)";
  function quoteHtml(q){
    q = String(q || "").trim();
    if (!q) return "";
    var sug = false;
    var m = q.replace(/\s*[（(]補充建議[）)]\s*$/, "");
    if (m !== q){ sug = true; q = m; }
    return '<div class="quote">' + escapeHtml(q) + (sug ? ' <span class="sug">補充建議</span>' : '') + '</div>';
  }
  function fmtDateTime(iso){
    var d = new Date(iso);
    if (isNaN(d)) return "";
    return (d.getMonth()+1) + "/" + d.getDate() + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }
  function fmtDateLabel(ds){
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(ds || "");
    return m ? (m[1] + "年" + Number(m[2]) + "月" + Number(m[3]) + "日") : (ds || "");
  }

  // ---------- 填寫 ----------
  var currentStore = DEFAULT_STORE;
  try { var ls = localStorage.getItem(STORE_KEY); if (ls && STAFF[ls]) currentStore = ls; } catch(e){}
  var storeSeg = document.getElementById("store-seg");
  var nameSel = document.querySelector('#memory-form select[name="name"]');
  function setStore(st){
    currentStore = st;
    try { localStorage.setItem(STORE_KEY, st); } catch(e){}
    Array.prototype.forEach.call(storeSeg.children, function(b){ b.classList.toggle("on", b.getAttribute("data-store") === st); });
    fillSelect(nameSel, STAFF[st], "請選擇姓名");
    renderToday();
  }
  storeSeg.innerHTML = STORES.map(function(st){ return '<button type="button" data-store="' + escapeHtml(st) + '">' + escapeHtml(st) + '</button>'; }).join("");
  storeSeg.addEventListener("click", function(e){
    var b = e.target.closest("button"); if (!b) return;
    setStore(b.getAttribute("data-store"));
  });
  var dateInput = document.querySelector('#memory-form input[name="date"]');
  dateInput.value = todayStr();

  var tabs = document.querySelectorAll(".tab");
  var views = { fill: document.getElementById("view-fill"), admin: document.getElementById("view-admin") };
  var page = document.getElementById("page");
  function showTab(which){
    tabs.forEach(function(x){ x.classList.toggle("active", x.getAttribute("data-tab") === which); });
    Object.keys(views).forEach(function(k){ views[k].hidden = (k !== which); });
    page.classList.toggle("wide", which === "admin");
    if (which === "admin") refreshAll();
    window.scrollTo(0, 0);
  }
  tabs.forEach(function(t){ t.addEventListener("click", function(){ showTab(t.getAttribute("data-tab")); }); });

  var memoryForm = document.getElementById("memory-form");
  var memoryStatus = document.getElementById("memory-status");
  var dbNotice = document.getElementById("db-notice");

  function setStatus(el, msg, ok){
    el.textContent = msg;
    el.style.color = ok ? "var(--good)" : "var(--bad)";
    if (msg) setTimeout(function(){ if (el.textContent === msg) el.textContent = ""; }, 3500);
  }

  // ---------- Web App URL ----------
  function getWebAppUrl(){
    try { return localStorage.getItem(STORAGE_KEY) || DEFAULT_WEBAPP_URL || ""; }
    catch(e){ return DEFAULT_WEBAPP_URL || ""; }
  }
  function setWebAppUrl(url){ try { localStorage.setItem(STORAGE_KEY, url); } catch(e){} }
  function showSetupModal(prefill){
    var backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    backdrop.innerHTML =
      '<div class="modal"><h2>連接資料庫</h2>' +
      '<p>請貼上 Google Apps Script 的「網頁應用程式網址」（結尾通常是 /exec）。</p>' +
      '<input type="text" id="webapp-url-input" placeholder="https://script.google.com/macros/s/.../exec" value="' + escapeHtml(prefill||"") + '">' +
      '<button class="btn btn-primary" id="webapp-url-save">儲存並開始使用</button></div>';
    document.body.appendChild(backdrop);
    document.getElementById("webapp-url-save").addEventListener("click", function(){
      var val = document.getElementById("webapp-url-input").value.trim();
      if (!val) return;
      setWebAppUrl(val);
      document.body.removeChild(backdrop);
      init();
    });
  }
  document.getElementById("settings-gear").addEventListener("click", function(){ showSetupModal(getWebAppUrl()); });

  // ---------- API ----------
  function apiPost(sheet, data){
    return fetch(getWebAppUrl(), {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(Object.assign({ sheet: sheet }, data))
    }).then(function(res){ return res.json(); });
  }
  function apiGet(sheet){
    return fetch(getWebAppUrl() + "?sheet=" + encodeURIComponent(sheet)).then(function(res){ return res.json(); });
  }

  var memoriesCache = [];
  var commentsCache = [];
  var drafts = {};          // memoId -> { mgr, text }
  var lastSig = "";

  setStore(currentStore);

  function monthOf(m){
    var d = String(m.date || "");
    if (/^\d{4}-\d{2}/.test(d)) return d.slice(0,7);
    var dt = new Date(m.timestamp || Date.now());
    return dt.getFullYear() + "-" + pad(dt.getMonth()+1);
  }
  function sortKey(m){ return new Date(m.timestamp || 0).getTime() || 0; }

  function renderToday(){
    var list = document.getElementById("memory-today-items");
    var today = todayStr();
    var todays = memoriesCache.filter(function(m){ return String(m.date||"").slice(0,10) === today && storeOf(m) === currentStore; });
    document.getElementById("memory-today-count").textContent = String(todays.length);
    list.innerHTML = todays.map(function(m){
      return '<li><span class="li-name">' + escapeHtml(m.name) + '</span><span class="li-quote">「' + escapeHtml(String(m.quote||"").replace(/\s*[（(]補充建議[）)]\s*$/, "")) + '」</span></li>';
    }).join("");
  }

  // ---------- 總覽 ----------
  var fStore = document.getElementById("f-store");
  var fFb = document.getElementById("f-fb");
  var fSort = document.getElementById("f-sort");
  var fPerson = document.getElementById("f-person");
  var fMonth = document.getElementById("f-month");
  var fQ = document.getElementById("f-q");
  var feed = document.getElementById("feed");

  function refreshFilterOptions(){
    var people = {}; var months = {};
    var sv = fStore.value || "全部";
    var sOpts = ["全部"].concat(STORES);
    fillSelect(fStore, sOpts);
    fStore.value = sOpts.indexOf(sv) >= 0 ? sv : "全部";
    memoriesCache.forEach(function(m){
      if (fStore.value !== "全部" && storeOf(m) !== fStore.value) return;
      if (m.name) people[m.name] = 1; months[monthOf(m)] = 1;
    });
    STORES.forEach(function(st){
      if (fStore.value !== "全部" && st !== fStore.value) return;
      STAFF[st].forEach(function(n){ people[n] = 1; });
    });
    var pv = fPerson.value || "全部", mv = fMonth.value || "全部";
    var pOpts = ["全部"].concat(Object.keys(people));
    var mOpts = ["全部"].concat(Object.keys(months).sort().reverse());
    fillSelect(fPerson, pOpts); fillSelect(fMonth, mOpts);
    fPerson.value = pOpts.indexOf(pv) >= 0 ? pv : "全部";
    fMonth.value = mOpts.indexOf(mv) >= 0 ? mv : "全部";
  }

  function commentsFor(id){
    return commentsCache.filter(function(c){ return c.memoId === id; })
      .sort(function(a,b){ return new Date(a.timestamp) - new Date(b.timestamp); });
  }

  function renderFeed(force){
    var sig = JSON.stringify([memoriesCache.length, commentsCache.length, fStore.value, fFb.value, fSort.value, fPerson.value, fMonth.value, fQ.value]);
    if (!force && sig === lastSig) return;
    lastSig = sig;

    var q = fQ.value.trim().toLowerCase();
    var rows = memoriesCache.filter(function(m){
      if (fStore.value !== "全部" && storeOf(m) !== fStore.value) return false;
      if (fFb.value !== "all"){
        var n = commentsFor(m.id).length;
        if (fFb.value === "none" && n > 0) return false;
        if (fFb.value === "has" && n === 0) return false;
      }
      if (fPerson.value !== "全部" && m.name !== fPerson.value) return false;
      if (fMonth.value !== "全部" && monthOf(m) !== fMonth.value) return false;
      if (q){
        var blob = [m.name, m.appearance, m.trigger, m.resolution, m.quote].join(" ").toLowerCase();
        if (blob.indexOf(q) < 0) return false;
      }
      return true;
    });
    rows.sort(function(a,b){ return fSort.value === "old" ? sortKey(a)-sortKey(b) : sortKey(b)-sortKey(a); });

    var split = "";
    if (fStore.value === "全部"){
      split = "（" + STORES.map(function(st){
        return st + " " + rows.filter(function(m){ return storeOf(m) === st; }).length;
      }).join("・") + "）";
    }
    var noFb = rows.filter(function(m){ return commentsFor(m.id).length === 0; }).length;
    document.getElementById("count-line").innerHTML = "共 <b>" + rows.length + "</b> 則記憶點" + split +
      (noFb ? "　<span style=\"color:var(--bad)\">尚未回饋 " + noFb + " 則</span>" : "");
    if (!rows.length){
      feed.innerHTML = '<div class="empty-card">沒有符合條件的記憶點。</div>';
      return;
    }
    feed.innerHTML = rows.map(function(m){
      var cms = commentsFor(m.id);
      var dr = drafts[m.id] || {};
      var mgrSel = dr.mgr || (function(){ try { return localStorage.getItem(MGR_KEY) || ""; } catch(e){ return ""; } })();
      var cmHtml = cms.map(function(c){
        return '<div class="cm-item"><div class="avatar mgr">' + escapeHtml((c.manager||"?").charAt(0)) + '</div>' +
          '<div class="cm-main"><div class="cm-meta"><span class="who">' + escapeHtml(c.manager) + '</span><span class="when">' + escapeHtml(fmtDateTime(c.timestamp)) + '</span></div>' +
          '<div class="cm-text">' + escapeHtml(c.text) + '</div></div></div>';
      }).join("");
      var opts = '<option value="">選擇主管</option>' + (MANAGERS_BY_STORE[storeOf(m)] || []).map(function(n){
        return '<option value="' + escapeHtml(n) + '"' + (n === mgrSel ? " selected" : "") + '>' + escapeHtml(n) + '</option>';
      }).join("");
      return '<article class="post" data-id="' + escapeHtml(m.id) + '">' +
        '<div class="post-body">' +
          '<div class="post-head"><div class="avatar">' + escapeHtml((m.name||"?").charAt(0)) + '</div>' +
          '<div class="post-who"><span class="nm">' + escapeHtml(m.name) + '<span class="store-tag">' + escapeHtml(storeOf(m)) + '</span>' + (cms.length ? '' : '<span class="pending">尚未回饋</span>') + '</span><span class="dt">' + escapeHtml(fmtDateLabel(m.date)) + '</span></div></div>' +
          quoteHtml(m.quote) +
          '<div class="rows">' +
            '<div class="r"><span class="k">客戶樣貌</span><span class="v">' + escapeHtml(m.appearance) + '</span></div>' +
            '<div class="r"><span class="k">觸發的事件</span><span class="v">' + escapeHtml(m.trigger) + '</span></div>' +
            '<div class="r"><span class="k">解決的事情</span><span class="v">' + escapeHtml(m.resolution) + '</span></div>' +
          '</div></div>' +
        '<div class="cm"><div class="cm-title">主管回饋（' + cms.length + '）</div>' + cmHtml +
          '<div class="cm-form"><div class="row"><select class="cm-mgr">' + opts + '</select>' +
          '<textarea class="cm-text-in" rows="2" placeholder="留下回饋…">' + escapeHtml(dr.text || "") + '</textarea></div>' +
          '<div class="act"><button type="button" class="btn btn-primary btn-sm cm-send">送出回饋</button><span class="save-status cm-status"></span></div></div>' +
        '</div></article>';
    }).join("");
  }

  fStore.addEventListener("change", function(){ refreshFilterOptions(); renderFeed(true); });
  [fFb, fSort, fPerson, fMonth].forEach(function(el){ el.addEventListener("change", function(){ renderFeed(true); }); });
  fQ.addEventListener("input", function(){ renderFeed(true); });

  // keep drafts when typing
  feed.addEventListener("input", function(e){
    var post = e.target.closest(".post"); if (!post) return;
    var id = post.getAttribute("data-id");
    drafts[id] = drafts[id] || {};
    if (e.target.classList.contains("cm-text-in")) drafts[id].text = e.target.value;
  });
  feed.addEventListener("change", function(e){
    var post = e.target.closest(".post"); if (!post) return;
    if (e.target.classList.contains("cm-mgr")){
      var id = post.getAttribute("data-id");
      drafts[id] = drafts[id] || {};
      drafts[id].mgr = e.target.value;
      try { localStorage.setItem(MGR_KEY, e.target.value); } catch(err){}
    }
  });
  feed.addEventListener("click", function(e){
    var btn = e.target.closest(".cm-send"); if (!btn) return;
    var post = btn.closest(".post"); var id = post.getAttribute("data-id");
    var mgr = post.querySelector(".cm-mgr").value;
    var text = post.querySelector(".cm-text-in").value.trim();
    var st = post.querySelector(".cm-status");
    if (!mgr || !text){ setStatus(st, "請選擇主管並寫下回饋", false); return; }
    if (!getWebAppUrl()){ showSetupModal(""); return; }
    btn.disabled = true;
    var memo = memoriesCache.filter(function(m){ return m.id === id; })[0] || {};
    apiPost("comments", { memoId: id, manager: mgr, text: text, store: storeOf(memo), memoName: memo.name || "", memoDate: memo.date || "" }).then(function(res){
      if (res && res.error) throw new Error(res.error);
      commentsCache.push({ timestamp: new Date().toISOString(), memoId: id, manager: mgr, text: text });
      drafts[id] = { mgr: mgr, text: "" };
      renderFeed(true);
    }).catch(function(err){
      btn.disabled = false;
      setStatus(st, "送出失敗：" + (err && err.message ? err.message : "請稍後再試"), false);
    });
  });

  function refreshAll(){
    if (!getWebAppUrl()) return;
    Promise.all([apiGet("memories"), apiGet("comments")]).then(function(r){
      memoriesCache = Array.isArray(r[0]) ? r[0] : [];
      commentsCache = Array.isArray(r[1]) ? r[1] : [];
      renderToday();
      refreshFilterOptions();
      renderFeed(false);
    }).catch(function(){});
  }

  function disableForms(disabled, msg){
    Array.prototype.forEach.call(memoryForm.elements, function(el){ el.disabled = disabled; });
    dbNotice.hidden = !(disabled && msg);
    if (disabled && msg) dbNotice.textContent = msg;
  }

  function init(){
    if (!getWebAppUrl()){
      disableForms(true, "尚未連接資料庫，請先點右下角 ⚙ 設定 Google 試算表連接網址。");
      showSetupModal("");
      return;
    }
    disableForms(false);
    refreshAll();
    if (window.__amoPoll) clearInterval(window.__amoPoll);
    window.__amoPoll = setInterval(function(){
      // 正在輸入回饋時不重新整理，避免打斷
      var a = document.activeElement;
      if (a && (a.classList.contains("cm-text-in") || a.id === "f-q")) return;
      refreshAll();
    }, 20000);
  }

  memoryForm.addEventListener("submit", function(e){
    e.preventDefault();
    if (!getWebAppUrl()){ showSetupModal(""); return; }
    var fd = new FormData(memoryForm);
    var data = {
      name: fd.get("name"), date: fd.get("date"),
      appearance: (fd.get("appearance")||"").trim(),
      trigger: (fd.get("trigger")||"").trim(),
      resolution: (fd.get("resolution")||"").trim(),
      quote: (fd.get("quote")||"").trim(),
      store: currentStore
    };
    if (!data.name || !data.appearance || !data.trigger || !data.resolution || !data.quote){
      setStatus(memoryStatus, "請填寫完整內容", false);
      return;
    }
    var btn = memoryForm.querySelector('button[type="submit"]');
    if (btn.disabled) return;
    btn.disabled = true;
    apiPost("memories", data).then(function(res){
      if (res && res.error) throw new Error(res.error);
      setStatus(memoryStatus, "已送出，可以繼續寫下一則", true);
      memoriesCache.push(Object.assign({ id: res.id || ("local-" + Date.now()), timestamp: new Date().toISOString() }, data));
      renderToday();
      var keepName = data.name, keepDate = data.date;
      memoryForm.reset();
      nameSel.value = keepName;
      memoryForm.querySelector('input[name="date"]').value = keepDate;
    }).catch(function(err){
      setStatus(memoryStatus, "送出失敗，請確認網路或設定：" + (err && err.message ? err.message : ""), false);
    }).finally(function(){ btn.disabled = false; });
  });

  init();
})();
</script>
</body>
</html>
